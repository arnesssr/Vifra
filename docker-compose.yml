version: '3.8'

services:
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: vpsmonitor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://user:password@db:5432/vpsmonitor?sslmode=disable
      - SERVER_ADDRESS=:8080
      - JWT_SECRET=your-secret-key
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: